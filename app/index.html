<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudScale Web App</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
            width: 520px;
        }

        h1 {
            color: #0f62fe;
            margin-bottom: 10px;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        .name {
            font-weight: bold;
            color: #0f62fe;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>CloudScale Web Application</h1>
        <h2>Infrastructure as Code Project</h2>

        <p>
            This containerized web application was created by
            <span class="name">Dief allah Ateeyah</span>.
        </p>

        <p>
            The application is deployed using Docker, Terraform, Azure,
            and GitHub Actions.
        </p>
    </div>
</body>
</html>
